<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="pwa-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="pwa-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Corner Fold Gradient -->
    <linearGradient id="pwa-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- AI Star Gradient -->
    <linearGradient id="pwa-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="pwa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="pwa-badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#pwa-bg)" stroke="url(#pwa-border)" stroke-width="12" />

  <!-- Top Glass Highlight Reflection -->
  <path d="M 40 140 C 40 68 70 40 140 40 L 372 40 C 442 40 472 68 472 140 C 380 120 130 120 40 140 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Floating Main CV Document Sheet -->
  <g filter="url(#pwa-shadow)">
    <!-- Document with folded top-right corner -->
    <path d="M 120 120 C 120 98 138 80 160 80 L 290 80 L 392 182 L 392 392 C 392 414 374 432 352 432 L 160 432 C 138 432 120 414 120 392 Z" fill="url(#pwa-card)" />

    <!-- Folded Corner Triangle -->
    <path d="M 290 80 L 290 166 C 290 175 297 182 306 182 L 392 182 Z" fill="url(#pwa-fold)" />

    <!-- CV Header Color Bar -->
    <rect x="156" y="122" width="100" height="24" rx="12" fill="#2563eb" />

    <!-- Avatar Circle -->
    <circle cx="180" cy="204" r="28" fill="#3b82f6" />
    <circle cx="180" cy="198" r="11" fill="#ffffff" />
    <path d="M 164 220 A 16 16 0 0 1 196 220 Z" fill="#ffffff" />

    <!-- Candidate Name & Subtitle Lines -->
    <rect x="224" y="188" width="130" height="14" rx="7" fill="#0f172a" />
    <rect x="224" y="210" width="85" height="10" rx="5" fill="#64748b" />

    <!-- Divider Line -->
    <rect x="156" y="250" width="200" height="4" rx="2" fill="#e2e8f0" />

    <!-- Experience Section Block -->
    <rect x="156" y="272" width="110" height="14" rx="7" fill="#2563eb" />
    <rect x="156" y="296" width="200" height="8" rx="4" fill="#94a3b8" />
    <rect x="156" y="312" width="160" height="8" rx="4" fill="#cbd5e1" />

    <!-- Skills Badges Section -->
    <rect x="156" y="344" width="60" height="18" rx="9" fill="#dbeafe" />
    <rect x="224" y="344" width="70" height="18" rx="9" fill="#dbeafe" />
    <rect x="302" y="344" width="54" height="18" rx="9" fill="#dbeafe" />

    <!-- Summary line -->
    <rect x="156" y="380" width="190" height="8" rx="4" fill="#e2e8f0" />
  </g>

  <!-- AI Star / Pro Badge in Bottom Right -->
  <g transform="translate(300, 300)" filter="url(#pwa-badge-shadow)">
    <circle cx="68" cy="68" r="62" fill="#0f172a" stroke="#60a5fa" stroke-width="6" />
    <!-- 8-point AI spark star -->
    <path d="M 68 20 L 78 52 C 80 58 86 64 92 66 L 124 76 L 92 86 C 86 88 80 94 78 100 L 68 132 L 58 100 C 56 94 50 88 44 86 L 12 76 L 44 66 C 50 64 56 58 58 52 Z" fill="url(#pwa-star)" />
  </g>
</svg>
